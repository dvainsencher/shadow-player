<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Player</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><div class="eyebrow">LOCAL PRESENTATION SHADOWING</div><h1>Shadow Player</h1><div id="meta"></div></div>
<button id="hideBtn">Hide text <kbd>H</kbd></button></header>
<div class="layout"><nav id="sections"></nav><main>
<div class="topbar"><div id="position"></div><div class="speed" id="speedButtons"></div></div>
<div id="reader"></div>
<div class="player"><button id="prev">←</button><button id="play" class="primary">▶ Play</button>
<button id="repeat">↻ Repeat</button><button id="next">Next →</button></div>
<div class="hint"><span>Space play/pause</span><span>R repeat</span><span>← → navigate</span><span>H hide text</span><span id="speedHint"></span></div>
</main></div><script src="app.js"></script></body></html>
